<style>
  :root { --ink: #111; --brand: #FE971A; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 50% 30%, rgba(254, 151, 26, .25), transparent 60%), var(--ink);
    color: #fff; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center;
  }
  img { width: 180px; height: 180px; transform: rotate(-8deg); filter: drop-shadow(4px 6px 0 rgba(0, 0, 0, .55)); }
  h1 { font-size: 2.2rem; margin: 18px 0 4px; letter-spacing: .02em; }
  h1 span { color: var(--brand); }
  p { color: #cfcfcf; font-weight: 700; margin: 6px 0; }
  a.btn {
    display: inline-block; margin-top: 22px; padding: 14px 30px; border-radius: 999px;
    background: var(--brand); color: var(--ink); font-weight: 900; font-size: 1.1rem; text-decoration: none;
    border: 3px solid #fff; box-shadow: 4px 5px 0 rgba(255, 255, 255, .25);
  }
  .note { font-size: .85rem; color: #999; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="YAME PICK">
  <h1>YAME <span>PICK</span><br>参加確認</h1>
  <p>八女でピックルボールを楽しもう‼️</p>
  <a class="btn" id="go" href="#">🏓 参加確認ページを開く</a>
  <p class="note" id="msg">自動で移動します…</p>
</main>
<script>
  // Streamlit アプリのURL（アプリのURLが変わったらここを書き換える）
  const APP_URL = "https://pickleball-app-4vdhbkkfrztdscguvjgqja.streamlit.app";

  const go = document.getElementById("go");
  const msg = document.getElementById("msg");
  if (APP_URL) {
    go.href = APP_URL;
    setTimeout(() => location.replace(APP_URL), 300);
  } else {
    msg.textContent = "準備中です。しばらくお待ちください。";
    go.style.opacity = .4;
  }
</script>
</body>
